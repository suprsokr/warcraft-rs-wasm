[package]
name = "wow-blp-web"
description = "wasm-bindgen web bindings for the wow-blp BLP texture library"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# rlib so native `cargo test`/`cargo doc` work; cdylib for the wasm module
crate-type = ["cdylib", "rlib"]

[dependencies]
wow-blp = { path = "../../file-formats/graphics/wow-blp", version = "0.6.4" }
wow-web-common = { path = "../wow-web-common" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true, features = ["derive"] }
serde-wasm-bindgen = "0.6"
image = "0.25"

[package.metadata.wasm-pack]
# Build with: wasm-pack build --target web
