[package]
name = "wow-cdbc-web"
description = "wasm-bindgen web bindings for the wow-cdbc DBC database library"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# rlib so native `cargo test`/`cargo doc` work; cdylib for the wasm module
crate-type = ["cdylib", "rlib"]

[dependencies]
wow-cdbc = { path = "../../file-formats/database/wow-cdbc", version = "0.6.4", features = ["serde"] }
wow-web-common = { path = "../wow-web-common" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde-wasm-bindgen = "0.6"

[package.metadata.wasm-pack]
# Build with: wasm-pack build --target web
