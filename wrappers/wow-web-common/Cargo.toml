[package]
name = "wow-web-common"
description = "Shared utilities for the wow-*-web wasm-bindgen wrapper crates"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# rlib only: this crate is not a standalone web package.
crate-type = ["rlib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true }
serde-wasm-bindgen = "0.6"
