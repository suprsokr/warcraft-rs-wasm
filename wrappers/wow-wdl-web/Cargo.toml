[package]
name = "wow-wdl-web"
description = "wasm-bindgen web bindings for the wow-wdl low-resolution terrain library"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# rlib so native `cargo test`/`cargo doc` work; cdylib for the wasm module
crate-type = ["cdylib", "rlib"]

[dependencies]
wow-wdl = { path = "../../file-formats/world-data/wow-wdl", version = "0.6.4", features = ["serde"] }
wow-web-common = { path = "../wow-web-common" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true, features = ["derive"] }

[package.metadata.wasm-pack]
# Build with: wasm-pack build --target web
