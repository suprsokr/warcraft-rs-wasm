[package]
name = "wow-mpq-web"
description = "wasm-bindgen web bindings for the wow-mpq MPQ archive library"
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true

[lib]
# rlib so native `cargo test`/`cargo doc` work; cdylib for the wasm module
crate-type = ["cdylib", "rlib"]

[dependencies]
wow-mpq = { path = "../../file-formats/archives/wow-mpq", version = "0.6.4" }
wow-web-common = { path = "../wow-web-common" }

wasm-bindgen = "0.2"
js-sys = "0.3"
serde = { workspace = true, features = ["derive"] }
wasm-bindgen-futures = "0.4"

[package.metadata.wasm-pack]
# Build with: wasm-pack build --target web
