name: Release

# Creates a tagged GitHub release and publishes the prebuilt wasm-bindgen
# web packages to both GitHub releases and npm. The packages are the same
# output as `wasm-bindgen --target web`, plus package.json/README/licenses,
# so JS/TS users can download or install them without a Rust toolchain.
# No Rust library artifacts are published: Rust consumers build from source
# (git dependency) for whatever target they need — prebuilt rlibs would be
# tied to one exact rustc version.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-web:
    name: Build web packages
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wrapper: [wow-adt-web, wow-blp-web, wow-cdbc-web, wow-m2-web, wow-mpq-web, wow-wdl-web, wow-wdt-web, wow-wmo-web]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.92"
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wasm-bindgen-cli (matching the crate version)
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/{getline; print; exit}' Cargo.lock | cut -d'"' -f2)
          echo "wasm-bindgen crate version: $version"
          cargo install wasm-bindgen-cli --locked --version "$version"

      - name: Install binaryen (wasm-opt)
        run: |
          sudo apt-get update
          sudo apt-get install -y binaryen
          wasm-opt --version

      - name: Build package
        run: |
          set -euo pipefail
          cargo build --release -p ${{ matrix.wrapper }} --target wasm32-unknown-unknown
          pkg="wrappers/${{ matrix.wrapper }}/pkg"
          wasm_name=$(echo '${{ matrix.wrapper }}' | tr - _)
          wasm-bindgen --target web --out-dir "$pkg" \
            "target/wasm32-unknown-unknown/release/${wasm_name}.wasm"
          wasm_file="$pkg/${wasm_name}_bg.wasm"
          echo "Wasm size before wasm-opt: $(wc -c < "$wasm_file") bytes"
          wasm-opt -Os -o "$wasm_file" "$wasm_file"
          echo "Wasm size after wasm-opt: $(wc -c < "$wasm_file") bytes"
          cp "wrappers/${{ matrix.wrapper }}/package.json" "$pkg/"
          cp "wrappers/${{ matrix.wrapper }}/README.md" "$pkg/"
          cp LICENSE-APACHE LICENSE-MIT "$pkg/"
          # Pin the published npm version to the git tag (strip the leading 'v').
          node -e "
            const fs = require('fs');
            const pkgPath = '$pkg/package.json';
            const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
            pkg.version = '${GITHUB_REF_NAME#v}';
            fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          "

      - name: Smoke test
        run: node "wrappers/${{ matrix.wrapper }}/tests/smoke.mjs"

      - name: Package tarball
        run: |
          set -euo pipefail
          tarball="${{ matrix.wrapper }}-${GITHUB_REF_NAME}-web.tar.gz"
          tar -C "wrappers/${{ matrix.wrapper }}" -czf "$tarball" pkg
          echo "tarball=$tarball" >> "$GITHUB_ENV"

      - name: Upload tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.wrapper }}-web
          path: "${{ matrix.wrapper }}-${{ github.ref_name }}-web.tar.gz"
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: build-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-web"
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: "*.tar.gz"
          generate_release_notes: true

  publish-npm:
    name: Publish to npm
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: read
      id-token: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - uses: actions/download-artifact@v4
        with:
          pattern: "*-web"
          merge-multiple: true

      - name: Publish packages
        run: |
          set -euo pipefail
          for tarball in ./*.tar.gz; do
            tmp=$(mktemp -d)
            tar -xzf "$tarball" -C "$tmp"
            cd "$tmp/pkg"
            # The package.json version was already set to the git tag in the build job.
            npm publish --provenance --access public
            cd -
            rm -rf "$tmp"
          done
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
