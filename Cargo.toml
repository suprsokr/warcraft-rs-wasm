[workspace]
members = [
  # Archives
  "file-formats/archives/wow-mpq",

  # World Data
  "file-formats/world-data/wow-adt",
  "file-formats/world-data/wow-wdl",
  "file-formats/world-data/wow-wdt",

  # Graphics
  "file-formats/graphics/wow-blp",
  "file-formats/graphics/wow-m2",
  "file-formats/graphics/wow-wmo",

  # Database
  "file-formats/database/wow-cdbc",
]
resolver = "2"

[workspace.package]
version = "0.6.4"
authors = ["Daniel S. Reichenbach <daniel@kogito.network>"]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
repository = "https://github.com/wowemulation-dev/warcraft-rs"
homepage = "https://github.com/wowemulation-dev/warcraft-rs"

[workspace.dependencies]
# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Data structures and utilities
rand = "0.9"
tempfile = "3.24"
bitflags = "2.10"
bytes = "1.11"
memchr = "2.7"
glam = "0.31"
memmap2 = "0.9"
rayon = "1.11"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml_ng = "0.10"
binrw = "0.15.0"
csv = "1.4"

# CLI utilities
clap = { version = "4.5", features = ["derive"] }
indicatif = "0.18"

# FFI
libc = "0.2.180"

# Development
criterion = { version = "0.8", features = ["html_reports"] }
pretty_assertions = "1.4"
test-case = "3.3"
proptest = "1.5"
assert_cmd = "2.0"
predicates = "3.1"
